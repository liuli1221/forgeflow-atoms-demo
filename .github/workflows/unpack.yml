name: Unpack ForgeFlow release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack release and remove stale deployment files
        id: unpack
        run: |
          rm -f render.yaml docs/render-deploy.md
          if [ -f forgeflow-vercel-release.zip ]; then
            unzip -o forgeflow-vercel-release.zip
            rm forgeflow-vercel-release.zip
          fi
          if git diff --quiet && [ -z "$(git status --short)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit extracted project
        if: steps.unpack.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish ForgeFlow source"
          git push
